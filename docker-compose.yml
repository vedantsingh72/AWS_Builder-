services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_office
      POSTGRES_PASSWORD: dev
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/ai_office
      PORT: 3001
      AI_SERVICE_URL: http://ai:3002
    volumes: ["./services/api:/app/services/api", "./shared:/app/shared"]

  ai:
    build:
      context: .
      dockerfile: ./services/ai/Dockerfile
    ports: ["3002:3002"]
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/ai_office # checkpoint tables only
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_MODEL: llama-3.3-70b-versatile
      API_BASE_URL: http://api:3001
    volumes: ["./services/ai:/app/services/ai", "./shared:/app/shared"]

  web:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports: ["5173:5173"]
    depends_on: [api, ai]
    environment:
      VITE_API_URL: http://localhost:3001
    volumes: ["./frontend:/app/frontend", "./shared:/app/shared"]

volumes:
  pgdata:
